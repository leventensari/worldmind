services:
  dunya10:
    build: ..
    restart: unless-stopped
    env_file: ../.env
    ports: ["127.0.0.1:8080:8080"]
  caddy:
    image: caddy:2
    restart: unless-stopped
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    network_mode: host
volumes:
  caddy_data:
